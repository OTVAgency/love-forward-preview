<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media Kit — Love Forward Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #E82624;
    --black: #000000;
    --white: #FFFFFF;
    --grey: #808080;
    --grey-soft: #F5F5F5;
    --muted: #4A4A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
  }
  h1 {
    font-family: "League Spartan", "Open Sans", system-ui, sans-serif;
    font-size: clamp(1.75rem, 4vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }
  p { color: var(--muted); font-size: 1.05rem; max-width: 28rem; margin-bottom: 1.75rem; }
  a { color: var(--red); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1.5rem;
  }
  .bar {
    width: 3rem;
    height: 4px;
    background: var(--red);
    margin: 0 auto 1.5rem;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <img class="logo" src="assets/logo-circular.png" alt="Love Forward Foundation" width="88" height="88" />
  <div class="bar" aria-hidden="true"></div>
  <h1>Media kit coming soon</h1>
  <p>Our media kit is being finalized. Check back soon.</p>
  <p><a href="../landing/">← Back to home</a></p>
</body>
</html>
